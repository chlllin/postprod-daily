<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日工作摘要</title>
<style>
  :root {
    --bg: #F7F6F3;
    --surface: #FFFFFF;
    --border: #E8E6E1;
    --text-primary: #1A1A1A;
    --text-secondary: #6B6B6B;
    --text-muted: #9B9B9B;
    --accent: #1A1A1A;
    --tag-bg: #F0EDE8;
    --tag-text: #4A4A4A;
    --highlight: #F5F0EB;
    --sidebar-width: 220px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    line-height: 1.6;
    font-size: 14px;
    min-height: 100vh;
  }

  /* Layout */
  .layout {
    display: flex;
    min-height: 100vh;
  }

  /* Sidebar */
  .sidebar {
    width: var(--sidebar-width);
    position: fixed;
    top: 0; left: 0; bottom: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    z-index: 10;
  }

  .sidebar-header {
    padding: 28px 20px 20px;
    border-bottom: 1px solid var(--border);
  }

  .sidebar-title {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 4px;
  }

  .sidebar-sub {
    font-size: 11px;
    color: var(--text-muted);
  }

  /* Mode tabs */
  .mode-tabs {
    display: flex;
    padding: 12px 16px;
    gap: 6px;
    border-bottom: 1px solid var(--border);
  }

  .mode-btn {
    flex: 1;
    padding: 6px 0;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    background: transparent;
    color: var(--text-secondary);
    transition: all 0.15s;
  }

  .mode-btn:hover { background: var(--tag-bg); }
  .mode-btn.active {
    background: #555;
    color: white;
    border-color: #555;
  }

  /* Sidebar list (shared for both modes) */
  .sidebar-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
  }

  .sidebar-list::-webkit-scrollbar { width: 4px; }
  .sidebar-list::-webkit-scrollbar-track { background: transparent; }
  .sidebar-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .sidebar-item {
    padding: 10px 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: background 0.1s;
    border-left: 2px solid transparent;
  }

  .sidebar-item:hover { background: var(--highlight); }
  .sidebar-item.active {
    background: var(--highlight);
    border-left-color: var(--accent);
  }

  .sidebar-item-text {
    font-size: 13px;
    color: var(--text-primary);
  }

  .sidebar-item-meta {
    font-size: 11px;
    color: var(--text-muted);
  }

  .sidebar-item-shows {
    display: flex;
    gap: 3px;
  }

  .dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--text-muted);
  }

  /* Main content */
  .main {
    margin-left: var(--sidebar-width);
    flex: 1;
    max-width: 760px;
    padding: 48px 40px;
  }

  .entry { display: none; }
  .entry.visible { display: block; }

  /* Mobile back button */
  .back-btn {
    display: none;
    align-items: center;
    gap: 6px;
    padding: 12px 16px;
    border: none;
    background: none;
    font-size: 13px;
    color: var(--text-secondary);
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    width: 100%;
    text-align: left;
  }
  .back-btn::before { content: '‹'; font-size: 18px; line-height: 1; }

  /* ── Responsive: mobile ── */
  @media (max-width: 600px) {
    :root { --sidebar-width: 100vw; }

    html, body { overflow-x: hidden; }

    .sidebar {
      width: 100%;
      right: 0;
      transition: transform 0.25s ease;
    }

    .main {
      margin-left: 0;
      padding: 20px 16px 40px;
      max-width: 100%;
      width: 100%;
      display: none;
      overflow-x: hidden;
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    .content-list li { word-break: break-word; overflow-wrap: anywhere; }

    /* Long URLs: truncate with ellipsis */
    .content-list a {
      word-break: break-all;
      overflow-wrap: anywhere;
    }

    .back-btn { display: flex; }

    body.show-detail .sidebar { transform: translateX(-100%); pointer-events: none; }
    body.show-detail .main { display: block; }
  }

  .entry-header {
    margin-bottom: 36px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }

  .entry-date {
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  .entry-title {
    font-size: 24px;
    font-weight: 300;
    letter-spacing: -0.02em;
    color: var(--text-primary);
  }

  /* Show sections */
  .show-section {
    margin-bottom: 40px;
  }

  .show-section.hidden { display: none; }

  .show-name {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
    margin-top: 8px;
  }

  .show-badge {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--text-primary);
    white-space: nowrap;
  }

  .show-divider {
    flex: 1;
    height: 1px;
    background: var(--border);
    display: inline-block;
    vertical-align: middle;
    margin-left: 8px;
    width: 60px;
  }

  /* Episodes */
  .episode {
    margin-bottom: 24px;
  }

  .episode-title {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-secondary);
    margin-bottom: 10px;
  }

  /* General note */
  .general-note {
    background: var(--highlight);
    border-radius: 6px;
    padding: 14px 16px;
    margin-bottom: 16px;
  }

  .general-note .episode-title {
    color: var(--text-muted);
  }

  /* Episode title in show mode — larger */
  .episode-title-show {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-transform: none;
    color: var(--text-primary);
    margin-bottom: 10px;
  }

  /* Content items */
  .content-list {
    list-style: none;
    padding: 0;
  }

  .content-list li {
    padding: 6px 0 6px 14px;
    position: relative;
    color: var(--text-primary);
    font-size: 13.5px;
    line-height: 1.65;
    border-bottom: 1px solid var(--border);
  }

  .content-list li:last-child { border-bottom: none; }

  .content-list li::before {
    content: '';
    position: absolute;
    left: 0;
    top: 14px;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--text-muted);
  }

  code {
    font-family: "SF Mono", Menlo, monospace;
    font-size: 12px;
    background: var(--tag-bg);
    padding: 1px 5px;
    border-radius: 3px;
    color: var(--text-primary);
  }

  a {
    color: var(--text-secondary);
    text-decoration: none;
    border-bottom: 1px solid var(--border);
    transition: border-color 0.15s;
  }

  a:hover { border-color: var(--text-secondary); }

  strong { font-weight: 600; color: var(--text-primary); }

  /* Empty state */
  .empty {
    text-align: center;
    padding: 80px 20px;
    color: var(--text-muted);
    font-size: 13px;
  }

  /* Search */
  .search-wrap {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
  }

  .search-input {
    width: 100%;
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 12px;
    background: var(--bg);
    color: var(--text-primary);
    outline: none;
    transition: border-color 0.15s;
  }

  .search-input:focus { border-color: #bbb; }
  .search-input::placeholder { color: var(--text-muted); }


  /* Status badges */
  .ep-header {
    display: flex;
    align-items: baseline;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }
  .ep-header .episode-title-show { margin-bottom: 0; }

  .status-badges { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }

  .status-badge {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.03em;
    padding: 2px 7px;
    border-radius: 20px;
    white-space: nowrap;
    border: 1px solid transparent;
  }
  .status-badge .badge-label {
    opacity: 0.6;
    margin-right: 3px;
    font-weight: 400;
  }

  /* Status colour groups */
  .s-done  { background:#E8F5EE; color:#2D7A50; border-color:#C3E6D3; }
  .s-inprog{ background:#EBF0F8; color:#3A5F8A; border-color:#C8D9EF; }
  .s-audio { background:#F5EEF5; color:#7A4A7A; border-color:#DFC8DF; }
  .s-cut   { background:#F0EBF8; color:#5A3A8A; border-color:#D5C3EF; }
  .s-none  { background:#F2F2F0; color:#888; border-color:#DCDCDA; }
  .s-na    { background:transparent; color:#bbb; border-color:#E0E0DD; }
  /* Aired section */
  .aired-section { margin-top: 8px; margin-bottom: 32px; }

  .aired-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 0;
    background: none;
    border: none;
    border-top: 1px solid var(--border);
    width: 100%;
    cursor: pointer;
    text-align: left;
  }

  .aired-label {
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.04em;
    color: var(--text-muted);
  }

  .aired-chevron {
    font-size: 14px;
    color: var(--text-muted);
    transition: transform 0.2s;
    margin-left: auto;
    display: inline-block;
  }

  .aired-section.open .aired-chevron { transform: rotate(90deg); }

  .aired-content { display: none; }
  .aired-section.open .aired-content { display: block; }

  .aired-content .episode { opacity: 0.55; }

  /* Date tag on items (show mode) */
  .item-date {
    display: inline-block;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.04em;
    color: var(--text-muted);
    background: var(--tag-bg);
    padding: 1px 6px;
    border-radius: 3px;
    margin-right: 8px;
    vertical-align: middle;
    white-space: nowrap;
    flex-shrink: 0;
  }
</style>
</head>

</div>

]);

  'LINE 對話摘要','Todoist 未完成任務','待確認事項','通用規範與異動',
]);

// ─── STATE ───────────────────────────────────────────────────────

// ─── PARSE ───────────────────────────────────────────────────────
function isEp(s){ return /^EP\d/.test(s)||/^第\d/.test(s)||/^東森/.test(s)||/^\d+集/.test(s); }
function normalizeEp(s){ return s.replace(/^EP0*(\d+)/, 'EP$1'); }

function parseMd(md) {
  const dm = md.match(/# 每日摘要｜(\d{4}-\d{2}-\d{2})/);
  if (!dm) return null;
  const date = dm[1];
  const lines = md.split('\n');
  const shows = [];
  let cur = null, ep = null, buf = [], skip = false;
  function flush(){ if(ep!==null&&buf.length){ cur.episodes.push({title:ep,items:[...buf]}); } buf=[]; ep=null; }
  for (const line of lines) {
    if (line.startsWith('## ') && !line.startsWith('### ')) {
      const h = line.slice(3).trim();
      if (SKIP_SECTIONS.has(h)){ skip=true; continue; }
      if (KNOWN_SHOWS.has(h)){ skip=false; if(cur){flush();shows.push(cur);} cur={name:h,episodes:[]}; ep=null; }
      else if (isEp(h) && cur && !skip){ flush(); ep=normalizeEp(h); }
      continue;
    }
    if (skip) continue;
    if (line.startsWith('### ')){ flush(); ep=normalizeEp(line.slice(4).trim()); continue; }
    const bold = line.match(/^\*\*(.+?)\*\*$/);
    if (bold && cur){ flush(); ep=normalizeEp(bold[1].trim()); continue; }
    if ((line.startsWith('- ')||line.startsWith('* ')||/^\*{1,3}\s+/.test(line)) && cur){
      if(ep===null) ep='__general__';
      buf.push(line.replace(/^[-*]+\s+/,'').replace(/^\*{1,3}\s*/,'').trim()); continue;
    }
    if (/^\d+\.\s/.test(line) && cur){
      if(ep===null) ep='__general__';
      buf.push(line.replace(/^\d+\.\s+/,'').trim());
    }
  }
  if(cur){ flush(); shows.push(cur); }
  return { date, shows: shows.filter(s=>s.episodes.length>0) };
}

const parsed = SUMMARIES.map(parseMd).filter(Boolean).sort((a,b)=>b.date.localeCompare(a.date));

// ─── AGGREGATE BY SHOW ───────────────────────────────────────────
// showAgg[showName][epTitle] = [ {date, item} ]
const showAgg = {};
for (const {date, shows} of parsed) {
  for (const show of shows) {
    if (!showAgg[show.name]) showAgg[show.name] = {};
    for (const ep of show.episodes) {
      if (!showAgg[show.name][ep.title]) showAgg[show.name][ep.title] = [];
      for (const item of ep.items) {
        showAgg[show.name][ep.title].push({ date, item });
      }
    }
  }
}
const allShows = Object.keys(showAgg).sort();

// Sort episodes: __general__ first, then by EP number
function sortEps(eps) {
  return [...eps].sort((a,b)=>{
    if(a==='__general__') return -1;
    if(b==='__general__') return 1;
    const na = parseInt(a.replace(/\D+/g,''))||0;
    const nb = parseInt(b.replace(/\D+/g,''))||0;
    return na - nb;
  });
}

// ─── DATE HELPERS ────────────────────────────────────────────────
function fmtMd(d){ const [,m,dy]=d.split('-'); return `${parseInt(m)}/${parseInt(dy)}`; }

function fmtRelative(d) {
  const today = new Date(); today.setHours(0,0,0,0);
  const target = new Date(d+'T00:00:00'); target.setHours(0,0,0,0);
  const diff = Math.round((today-target)/86400000);
  const md = fmtMd(d);
  const dow = today.getDay();
  const toMon = dow===0?6:dow-1;
  const thisMonday = new Date(today); thisMonday.setDate(today.getDate()-toMon);
  const lastMonday = new Date(thisMonday); lastMonday.setDate(thisMonday.getDate()-7);
  if(diff===0) return `今天 ${md}`;
  if(diff===1) return `昨天 ${md}`;
  if(diff===2) return `前天 ${md}`;
  if(target>=thisMonday) return `${diff} 天前 ${md}`;
  if(target>=lastMonday) return `上週${'日一二三四五六'[target.getDay()]} ${md}`;
  return md;
}

function fmtFull(d){
  return new Date(d+'T00:00:00').toLocaleDateString('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'short'});
}

function escHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function formatItem(text){
  text=text.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  text=text.replace(/`([^`]+)`/g,'<code>$1</code>');
  text=text.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,'<a href="$1" target="_blank">$1</a>');
  text=text.replace(/(^|\s)(https?:\/\/\S+)/g,'$1<a href="$2" target="_blank">連結</a>');
  return text;
}

function buildSidebarList() {
  const list = document.getElementById('sidebarList');
  list.innerHTML = '';
  const q = searchQuery.toLowerCase();

  if (mode === 'show') {
    allShows.forEach(show=>{
      if(q && !show.toLowerCase().includes(q)) return;
      const item = document.createElement('div');
      item.className = 'sidebar-item' + (show===activeShow?' active':'');
      item.dataset.key = show;
      const epCount = Object.keys(showAgg[show]).filter(e=>e!=='__general__').length;
      item.innerHTML = `<span class="sidebar-item-text">${escHtml(show)}</span><span class="sidebar-item-meta">${epCount}集</span>`;
      item.addEventListener('click', ()=>selectShow(show));
      list.appendChild(item);
    });
  } else {
    parsed.forEach(p=>{
      if(q && !p.date.includes(q) && !fmtFull(p.date).toLowerCase().includes(q)) return;
      const item = document.createElement('div');
      item.className = 'sidebar-item' + (p.date===activeDate?' active':'');

      const dots = p.shows.map(()=>`<span class="dot"></span>`).join('');
      item.innerHTML = `<span class="sidebar-item-text">${fmtRelative(p.date)}</span><span class="sidebar-item-shows">${dots}</span>`;
      item.addEventListener('click', ()=>selectDate(p.date));
      list.appendChild(item);
    });
  }
}

  buildModeTabs();
  buildSidebarList();
  clearMain();
  if(mode==='show' && activeShow) renderShow(activeShow);
  else if(mode==='date' && activeDate) renderDate(activeDate);
}

function isAired(showName, epTitle) {
  const today = new Date(); today.setHours(0,0,0,0);
  // Normalize EP title: EP08 → EP8, EP08（東森版）→ skip
  const m = epTitle.match(/^EP(\d+)$/);
  if (!m) return false;  // EP8 PR, EP8（東森版）等不比對
  const normalized = `EP${parseInt(m[1])}`;
  // Try show name variants
  const bases = [showName, showName.replace(/\s+S\d+$/, ''), showName.replace(/S\d+$/, '')];
  for (const base of bases) {
    const d = BROADCAST[`${base}|${normalized}`];
    if (d) return new Date(d + 'T00:00:00') < today;
  }
  return false;
}

// ─── RENDER ───────────────────────────────────────────────────────
function clearMain(){
  const main = document.getElementById('mainContent');
  main.querySelectorAll('.entry').forEach(e=>e.remove());
  document.getElementById('emptyState').style.display='';
}

function setMain(elOrHtml){
  const main = document.getElementById('mainContent');
  document.getElementById('emptyState').style.display='none';
  main.querySelectorAll('.entry').forEach(e=>e.remove());
  if (typeof elOrHtml === 'string') {
    const div = document.createElement('div');
    div.className = 'entry visible';
    div.innerHTML = elOrHtml;
    main.appendChild(div);
  } else {
    main.appendChild(elOrHtml);
  }
}

function statusBadge(label, val) {
  if (!val || val === '未開始') return '';
  let cls = 's-none';
  if (val === '已交付') cls = 's-done';
  else if (['音效中','音效字幕審帶確認中'].includes(val)) cls = 's-audio';
  else if (['初剪中','初剪完成'].includes(val)) cls = 's-cut';
  else if (['ES 製作中','ES 修改中','審帶確認中','審帶修改中','修點確認中','待驗收','製作中'].includes(val)) cls = 's-inprog';
  else if (val === '不適用') cls = 's-na';
  return `<span class="status-badge ${cls}"><span class="badge-label">${label}</span>${escHtml(val)}</span>`;
}

function buildEpBlock(epTitle, items, showName) {
  const label = epTitle === '__general__' ? '通用事項' : escHtml(epTitle);
  let listHtml = '';
  items.forEach(({date, item}) => {
    listHtml += `<li><span class="item-date">${fmtMd(date)}</span>${formatItem(escHtml(item))}</li>`;
  });

  let badgesHtml = '';
  if (showName && epTitle !== '__general__') {
    const bases = [showName, showName.replace(/\s+S\d+$/, ''), showName.replace(/S\d+$/, '')];
    let st = null;
    for (const b of bases) {
      st = EP_STATUS[`${b}|${epTitle}`];
      if (st) break;
    }
    if (st) {
      const fb = statusBadge('正片', st.film);
      const pb = st.promo && st.promo !== '不適用' ? statusBadge('PR', st.promo) : '';
      if (fb || pb) badgesHtml = `<div class="status-badges">${fb}${pb}</div>`;
    }
  }

  return `<div class="episode">
    <div class="ep-header">
      <div class="episode-title-show">${label}</div>
      ${badgesHtml}
    </div>
    <ul class="content-list">${listHtml}</ul>
  </div>`;
}

function renderShow(showName) {
  const eps = showAgg[showName];
  if (!eps) return;

  const today = new Date(); today.setHours(0,0,0,0);
  const allEpTitles = sortEps(Object.keys(eps));

  const upcoming = [];
  const aired = [];
  allEpTitles.forEach(epTitle => {
    const items = eps[epTitle].slice().sort((a, b) => a.date.localeCompare(b.date));
    if (epTitle !== '__general__' && isAired(showName, epTitle)) {
      aired.push({ epTitle, items });
    } else {
      upcoming.push({ epTitle, items });
    }
  });

  const entry = document.createElement('div');
  entry.className = 'entry visible';

  let html = `<div class="entry-header">
    <div class="entry-title">${escHtml(showName)}</div>
  </div>`;

  // Upcoming episodes
  upcoming.forEach(({ epTitle, items }) => {
    html += buildEpBlock(epTitle, items, showName);
  });

  // Aired section (collapsed)
  if (aired.length > 0) {
    html += `<div class="aired-section">
      <button class="aired-toggle" onclick="this.parentElement.classList.toggle('open')">
        <span class="aired-label">已播出 ${aired.length} 集</span>
        <span class="aired-chevron">›</span>
      </button>
      <div class="aired-content">`;
    aired.forEach(({ epTitle, items }) => {
      html += buildEpBlock(epTitle, items, showName);
    });
    html += `</div></div>`;
  }

  entry.innerHTML = html;
  setMain(entry);
}

function renderDate(date) {
  const p = parsed.find(x=>x.date===date);
  if(!p) return;
  let html = `<div class="entry-header">
    <div class="entry-date">${fmtFull(date)}</div>
    <div class="entry-title">工作摘要</div>
  </div>`;
  p.shows.forEach(show=>{
    html += `<div class="show-section">
      <div class="show-name"><span class="show-badge">${escHtml(show.name)}</span><span class="show-divider"></span></div>`;
    show.episodes.forEach(ep=>{
      const isGen = ep.title==='__general__';
      html += `<div class="${isGen?'episode general-note':'episode'}">
        <div class="episode-title">${isGen?'通用事項':escHtml(ep.title)}</div>
        <ul class="content-list">`;
      ep.items.forEach(item=>{ html+=`<li>${formatItem(escHtml(item))}</li>`; });
      html+=`</ul></div>`;
    });
    html+=`</div>`;
  });
  setMain(html);
}
