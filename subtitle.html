<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>字幕進度</title>
<style>
  :root {
    --bg: #F7F6F3;
    --surface: #FFFFFF;
    --border: #E8E6E1;
    --text-primary: #1A1A1A;
    --text-secondary: #6B6B6B;
    --text-muted: #9B9B9B;
    --tag-bg: #F0EDE8;
    --tag-text: #4A4A4A;
    --highlight: #F5F0EB;
    --sidebar-width: 220px;
    --green: #27AE60; --green-bg: #EDFAF1;
    --orange: #D35400; --orange-bg: #FEF5EC;
    --blue: #2471A3; --blue-bg: #EDF6F9;
    --gray: #777; --gray-bg: #F4F4F4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text-primary);
    line-height: 1.6; font-size: 14px; min-height: 100vh;
  }
  .layout { display: flex; min-height: 100vh; }

  .sidebar {
    width: var(--sidebar-width); position: fixed;
    top: 0; left: 0; bottom: 0; background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden; z-index: 10;
  }
  .sidebar-header { padding: 24px 20px 16px; border-bottom: 1px solid var(--border); }
  .back-link {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; color: var(--text-muted); text-decoration: none;
    margin-bottom: 10px; transition: color 0.12s;
  }
  .back-link:hover { color: var(--text-primary); }
  .sidebar-title {
    font-size: 11px; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--text-muted); margin-bottom: 3px;
  }
  .sidebar-project { font-size: 14px; font-weight: 600; }
  .sidebar-updated { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

  .stats { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; }
  .stat-row { display: flex; align-items: center; justify-content: space-between; }
  .stat-label { font-size: 12px; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; }
  .stat-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .stat-num { font-size: 12px; font-weight: 600; }

  .filter-section { padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .filter-label { font-size: 11px; color: var(--text-muted); margin-bottom: 8px; letter-spacing: 0.05em; text-transform: uppercase; }
  .filter-btns { display: flex; flex-direction: column; gap: 4px; }
  .filter-btn {
    padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px;
    font-size: 12px; cursor: pointer; background: transparent;
    color: var(--text-secondary); text-align: left; transition: all 0.12s;
  }
  .filter-btn:hover { background: var(--highlight); }
  .filter-btn.active { background: var(--tag-bg); border-color: #ccc; color: var(--text-primary); font-weight: 500; }

  .main {
    margin-left: var(--sidebar-width); flex: 1;
    padding: 36px 40px 40px;
    overflow-y: auto;
  }

  .section-header {
    display: flex; align-items: baseline; gap: 10px;
    margin-bottom: 14px;
  }
  .section-title { font-size: 18px; font-weight: 700; }
  .section-count {
    font-size: 12px; color: var(--text-muted);
    background: var(--tag-bg); padding: 2px 8px;
    border-radius: 20px; font-weight: 500;
  }

  .table-wrap {
    border: 1px solid var(--border); border-radius: 8px;
    overflow: hidden; margin-bottom: 40px;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: left; padding: 10px 16px; font-size: 11px; font-weight: 600;
    letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted);
    border-bottom: 2px solid var(--border); background: #FAFAF8;
    white-space: nowrap;
  }
  td { padding: 10px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(0,0,0,0.015); }
  tr.hidden { display: none; }

  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 4px;
    font-size: 11px; font-weight: 500; white-space: nowrap;
  }
  .badge-waiting { background: var(--gray-bg); color: var(--gray); border: 1px solid #ddd; }
  .badge-ready { background: var(--orange-bg); color: var(--orange); border: 1px solid #f8d8b8; }
  .badge-progress { background: var(--blue-bg); color: var(--blue); border: 1px solid #aed6f1; }
  .badge-done { background: var(--green-bg); color: var(--green); border: 1px solid #b7eccd; }

  .note-text { font-size: 11px; color: var(--text-muted); font-style: italic; }
  .empty-row td { text-align: center; color: var(--text-muted); padding: 24px; font-size: 13px; }
</style>
</head>
<body>
<div class="layout">

<aside class="sidebar">
  <div class="sidebar-header">
    <a href="index.html" class="back-link">← 工作台</a>
    <div class="sidebar-title">字幕進度</div>
    <div class="sidebar-project">承影後製部</div>
    <div class="sidebar-updated" id="updated-time"></div>
  </div>

  <div class="stats" id="stats-panel"></div>

  <div class="filter-section">
    <div class="filter-label">篩選</div>
    <div class="filter-btns">
      <button class="filter-btn active" onclick="setFilter('all', this)">全部</button>
      <button class="filter-btn" onclick="setFilter('pending', this)">未完成</button>
      <button class="filter-btn" onclick="setFilter('done', this)">已完成</button>
    </div>
  </div>
</aside>

<main class="main">

  <div id="section-pending">
    <div class="section-header">
      <div class="section-title">未完成</div>
      <span class="section-count" id="count-pending">0 筆</span>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>節目名稱</th>
            <th>集數 / 單元</th>
            <th>狀態</th>
            <th>備註</th>
          </tr>
        </thead>
        <tbody id="tbody-pending"></tbody>
      </table>
    </div>
  </div>

  <div id="section-done">
    <div class="section-header">
      <div class="section-title">近兩週完成</div>
      <span class="section-count" id="count-done">0 筆</span>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>節目名稱</th>
            <th>集數 / 單元</th>
            <th>完成時間</th>
          </tr>
        </thead>
        <tbody id="tbody-done"></tbody>
      </table>
    </div>
  </div>

</main>
</div>

<script>
const DATA = {
  generated: "2026-05-18 09:30",
  pending: [
    { show: "fighting", episode: "13", status: "待字稿回", note: "" },
    { show: "兩鍋論", episode: "25", status: "待字稿回", note: "" }
  ],
  completed: [
    { show: "下面一位", episode: "116", edited: "2026-05-15" },
    { show: "超級總動員S23", episode: "10", edited: "2026-05-14" },
    { show: "鬧熱打擂台", episode: "526", edited: "2026-05-14" },
    { show: "超級總動員S23", episode: "09", edited: "2026-05-13" },
    { show: "fighting", episode: "12", edited: "2026-05-12" }
  ]
};

const STATUS_BADGE = {
  "待字稿回": "badge-waiting",
  "可上字":   "badge-ready",
  "上字未完": "badge-progress",
  "完成":     "badge-done"
};

document.getElementById('updated-time').textContent = '同步：' + DATA.generated;

// Stats
const pendingByStatus = {};
DATA.pending.forEach(r => { pendingByStatus[r.status] = (pendingByStatus[r.status] || 0) + 1; });
const statsRows = [
  { label: '待字稿回', cls: '--gray', count: pendingByStatus['待字稿回'] || 0 },
  { label: '可上字',   cls: '--orange', count: pendingByStatus['可上字'] || 0 },
  { label: '上字未完', cls: '--blue', count: pendingByStatus['上字未完'] || 0 },
  { label: '完成',     cls: '--green', count: DATA.completed.length + '筆（近5）' }
];
document.getElementById('stats-panel').innerHTML = statsRows.map(r =>
  `<div class="stat-row">
    <span class="stat-label"><span class="stat-dot" style="background:var(${r.cls})"></span>${r.label}</span>
    <span class="stat-num">${r.count}</span>
  </div>`
).join('');

// Pending table
const tbodyP = document.getElementById('tbody-pending');
document.getElementById('count-pending').textContent = DATA.pending.length + ' 筆';
if (DATA.pending.length === 0) {
  tbodyP.innerHTML = '<tr class="empty-row"><td colspan="4">目前無未完成項目</td></tr>';
} else {
  tbodyP.innerHTML = DATA.pending.map(r =>
    `<tr data-section="pending">
      <td><strong>${r.show}</strong></td>
      <td>${r.episode}</td>
      <td><span class="badge ${STATUS_BADGE[r.status] || ''}">${r.status}</span></td>
      <td>${r.note ? `<span class="note-text">${r.note}</span>` : '<span style="color:#ccc">—</span>'}</td>
    </tr>`
  ).join('');
}

// Completed table — past 14 days
const tbodyD = document.getElementById('tbody-done');
const refDate = new Date(DATA.generated.split(' ')[0]);
const cutoff = new Date(refDate); cutoff.setDate(cutoff.getDate() - 14);
const recentDone = DATA.completed.filter(r => new Date(r.edited) >= cutoff);
document.getElementById('count-done').textContent = recentDone.length + ' 筆';
if (recentDone.length === 0) {
  tbodyD.innerHTML = '<tr class="empty-row"><td colspan="3">近兩週無完成項目</td></tr>';
} else {
  tbodyD.innerHTML = recentDone.map(r =>
    `<tr data-section="done">
      <td><strong>${r.show}</strong></td>
      <td>${r.episode}</td>
      <td style="color:var(--text-secondary)">${r.edited}</td>
    </tr>`
  ).join('');
}

// Filter
function setFilter(f, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  const showPending = f === 'all' || f === 'pending';
  const showDone    = f === 'all' || f === 'done';
  document.getElementById('section-pending').style.display = showPending ? '' : 'none';
  document.getElementById('section-done').style.display    = showDone ? '' : 'none';
}
</script>
</body>
</html>
